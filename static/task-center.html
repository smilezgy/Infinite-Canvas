<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>任务中心</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/js/theme.js?v=2026.08.04.1787200475"></script>
    <script src="/static/js/touch-mouse.js?v=2026.08.04.1787200475"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.04.1787200475">
    <style>
        :root {
            --tc-bg: #fcfcfc;
            --tc-card: #ffffff;
            --tc-border: #efefef;
            --tc-border-strong: #e2e2e2;
            --tc-text: #121212;
            --tc-muted: #8e8e8e;
            --tc-subtle: #f6f6f6;
            --tc-accent: #121212;
            --tc-accent-text: #ffffff;
            --tc-star: #f5a623;
            --tc-danger: #e5484d;
            --tc-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
        }
        html.studio-theme-dark {
            --tc-bg: #08090c;
            --tc-card: #111216;
            --tc-border: #1e2027;
            --tc-border-strong: #2b2e38;
            --tc-text: #e8e8ea;
            --tc-muted: #8b8f9a;
            --tc-subtle: #171922;
            --tc-accent: #e8e8ea;
            --tc-accent-text: #111216;
            --tc-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            background: var(--tc-bg);
            color: var(--tc-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        .tc-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ---------- header ---------- */
        .tc-header {
            display: flex; align-items: center; gap: 12px;
            padding: 18px 24px 0;
            flex-shrink: 0;
        }
        .tc-title { font-size: 19px; font-weight: 650; letter-spacing: -.2px; }
        .tc-sub { font-size: 12px; color: var(--tc-muted); margin-left: 2px; }
        .tc-header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .tc-live {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--tc-muted);
            padding: 5px 10px; border-radius: 999px;
            background: var(--tc-subtle); border: 1px solid var(--tc-border);
        }
        .tc-live-dot {
            width: 6px; height: 6px; border-radius: 50%; background: #34c759;
            box-shadow: 0 0 0 3px rgba(52,199,89,.16);
        }
        .tc-live-dot.idle { background: var(--tc-muted); box-shadow: none; }

        .tc-btn {
            display: inline-flex; align-items: center; gap: 6px;
            height: 32px; padding: 0 12px;
            border-radius: 8px; border: 1px solid var(--tc-border-strong);
            background: var(--tc-card); color: var(--tc-text);
            font-size: 13px; cursor: pointer;
            transition: background .15s, border-color .15s, opacity .15s;
        }
        .tc-btn:hover { background: var(--tc-subtle); }
        .tc-btn:disabled { opacity: .45; cursor: not-allowed; }
        .tc-btn.primary { background: var(--tc-accent); color: var(--tc-accent-text); border-color: var(--tc-accent); }
        .tc-btn.primary:hover { opacity: .86; }
        .tc-btn.danger { color: var(--tc-danger); border-color: var(--tc-border-strong); }
        .tc-btn.danger:hover { background: rgba(229,72,77,.08); border-color: rgba(229,72,77,.4); }
        .tc-btn svg { width: 15px; height: 15px; }

        /* ---------- tabs ---------- */
        .tc-tabs {
            display: flex; gap: 22px;
            padding: 16px 24px 0; flex-shrink: 0;
            border-bottom: 1px solid var(--tc-border);
        }
        .tc-tab {
            position: relative; padding: 0 0 11px;
            font-size: 13.5px; color: var(--tc-muted);
            background: none; border: none; cursor: pointer;
            transition: color .15s;
        }
        .tc-tab:hover { color: var(--tc-text); }
        .tc-tab.active { color: var(--tc-text); font-weight: 600; }
        .tc-tab.active::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
            height: 2px; border-radius: 2px; background: var(--tc-text);
        }
        .tc-tab-count {
            display: inline-block; margin-left: 5px; padding: 0 5px;
            font-size: 11px; line-height: 16px; border-radius: 5px;
            background: var(--tc-subtle); color: var(--tc-muted);
        }

        /* ---------- panes ---------- */
        .tc-pane { flex: 1; overflow-y: auto; padding: 20px 24px 40px; display: none; }
        .tc-pane.active { display: block; }

        /* ---------- stat cards ---------- */
        .tc-stats {
            display: grid; gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            margin-bottom: 20px;
        }
        .tc-stat {
            background: var(--tc-card); border: 1px solid var(--tc-border);
            border-radius: 12px; padding: 14px 16px; box-shadow: var(--tc-shadow);
        }
        .tc-stat-label { font-size: 12px; color: var(--tc-muted); margin-bottom: 8px; }
        .tc-stat-value { font-size: 25px; font-weight: 650; letter-spacing: -.6px; line-height: 1; }
        .tc-stat-unit { font-size: 12px; font-weight: 400; color: var(--tc-muted); margin-left: 3px; }

        /* ---------- panels ---------- */
        .tc-panel {
            background: var(--tc-card); border: 1px solid var(--tc-border);
            border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
            box-shadow: var(--tc-shadow);
        }
        .tc-panel-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .tc-panel-title { font-size: 13.5px; font-weight: 600; }
        .tc-panel-hint { font-size: 12px; color: var(--tc-muted); }

        /* ---------- trend chart ---------- */
        .tc-chart {
            display: flex; align-items: flex-end; gap: 4px;
            height: 132px; padding-top: 8px;
        }
        .tc-bar-col {
            flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; height: 100%; gap: 6px; min-width: 0;
        }
        .tc-bar {
            width: 100%; max-width: 34px; min-height: 2px;
            background: var(--tc-accent); opacity: .82;
            border-radius: 4px 4px 2px 2px;
            transition: opacity .15s, height .3s;
            cursor: default;
        }
        .tc-bar:hover { opacity: 1; }
        .tc-bar.zero { background: var(--tc-border-strong); opacity: 1; }
        .tc-bar-label { font-size: 10px; color: var(--tc-muted); white-space: nowrap; }

        /* ---------- distribution ---------- */
        .tc-dist { display: grid; gap: 9px; }
        .tc-dist-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
        .tc-dist-name {
            width: 118px; flex-shrink: 0; color: var(--tc-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .tc-dist-track {
            flex: 1; height: 7px; border-radius: 999px;
            background: var(--tc-subtle); overflow: hidden;
        }
        .tc-dist-fill { height: 100%; border-radius: 999px; background: var(--tc-accent); opacity: .78; }
        .tc-dist-count { width: 44px; text-align: right; color: var(--tc-muted); font-variant-numeric: tabular-nums; }
        .tc-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 760px) { .tc-two-col { grid-template-columns: 1fr; } }

        /* ---------- running queue ---------- */
        .tc-run-list { display: grid; gap: 8px; }
        .tc-run-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 9px; background: var(--tc-subtle);
            font-size: 12.5px;
        }
        .tc-run-spin {
            width: 12px; height: 12px; flex-shrink: 0;
            border: 2px solid var(--tc-border-strong); border-top-color: var(--tc-text);
            border-radius: 50%; animation: tc-spin .8s linear infinite;
        }
        @keyframes tc-spin { to { transform: rotate(360deg); } }
        .tc-run-prompt {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .tc-run-meta { color: var(--tc-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .tc-empty {
            padding: 26px 0; text-align: center; color: var(--tc-muted); font-size: 12.5px;
        }

        /* ---------- toolbar ---------- */
        .tc-toolbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            margin-bottom: 14px;
        }
        .tc-search {
            position: relative; flex: 1; min-width: 180px; max-width: 320px;
        }
        .tc-search input {
            width: 100%; height: 32px; padding: 0 12px 0 32px;
            border-radius: 8px; border: 1px solid var(--tc-border-strong);
            background: var(--tc-card); color: var(--tc-text); font-size: 13px;
            outline: none; transition: border-color .15s;
        }
        .tc-search input:focus { border-color: var(--tc-text); }
        .tc-search svg {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; color: var(--tc-muted); pointer-events: none;
        }
        .tc-select {
            height: 32px; padding: 0 8px; border-radius: 8px;
            border: 1px solid var(--tc-border-strong); background: var(--tc-card);
            color: var(--tc-text); font-size: 12.5px; cursor: pointer; outline: none;
        }
        .tc-chip-toggle {
            display: inline-flex; align-items: center; gap: 5px;
            height: 32px; padding: 0 11px; border-radius: 8px;
            border: 1px solid var(--tc-border-strong); background: var(--tc-card);
            color: var(--tc-text); font-size: 12.5px; cursor: pointer;
        }
        .tc-chip-toggle.on {
            background: var(--tc-accent); color: var(--tc-accent-text); border-color: var(--tc-accent);
        }
        .tc-chip-toggle svg { width: 13px; height: 13px; }

        /* ---------- selection bar ---------- */
        .tc-selbar {
            display: none; align-items: center; gap: 10px;
            padding: 8px 14px; margin-bottom: 12px;
            border-radius: 10px; background: var(--tc-subtle);
            border: 1px solid var(--tc-border); font-size: 12.5px;
        }
        .tc-selbar.show { display: flex; }
        .tc-selbar-count { font-weight: 600; }
        .tc-selbar-spacer { flex: 1; }

        /* ---------- task grid ---------- */
        .tc-grid {
            display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
        }
        .tc-card {
            position: relative; background: var(--tc-card);
            border: 1px solid var(--tc-border); border-radius: 12px;
            overflow: hidden; box-shadow: var(--tc-shadow);
            transition: border-color .15s, transform .15s;
        }
        .tc-card:hover { border-color: var(--tc-border-strong); transform: translateY(-1px); }
        .tc-card.selected { border-color: var(--tc-text); }
        .tc-thumb {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            background: var(--tc-subtle); cursor: zoom-in; overflow: hidden;
        }
        .tc-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .tc-thumb-badge {
            position: absolute; left: 8px; top: 8px;
            padding: 2px 7px; border-radius: 6px;
            font-size: 10.5px; background: rgba(0,0,0,.62); color: #fff;
            backdrop-filter: blur(4px);
        }
        .tc-thumb-count {
            position: absolute; right: 8px; top: 8px;
            padding: 2px 7px; border-radius: 6px;
            font-size: 10.5px; background: rgba(0,0,0,.62); color: #fff;
        }
        .tc-check {
            position: absolute; left: 8px; bottom: 8px;
            width: 19px; height: 19px; border-radius: 6px;
            border: 1.5px solid rgba(255,255,255,.9);
            background: rgba(0,0,0,.28); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .15s, background .15s;
        }
        .tc-card:hover .tc-check, .tc-card.selected .tc-check { opacity: 1; }
        .tc-card.selected .tc-check { background: #fff; border-color: #fff; }
        .tc-check svg { width: 12px; height: 12px; color: #121212; display: none; }
        .tc-card.selected .tc-check svg { display: block; }
        .tc-fav {
            position: absolute; right: 8px; bottom: 8px;
            width: 26px; height: 26px; border-radius: 8px; border: none;
            background: rgba(0,0,0,.42); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; transition: opacity .15s, background .15s;
        }
        .tc-card:hover .tc-fav, .tc-fav.on { opacity: 1; }
        .tc-fav svg { width: 14px; height: 14px; color: #fff; }
        .tc-fav.on svg { color: #ff4d6d; fill: #ff4d6d; }

        .tc-card-body { padding: 10px 11px 11px; }
        .tc-prompt {
            font-size: 12.5px; line-height: 1.45; height: 36px;
            overflow: hidden; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            word-break: break-word; margin-bottom: 8px;
        }
        .tc-prompt.empty { color: var(--tc-muted); font-style: italic; }
        .tc-meta {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--tc-muted); margin-bottom: 8px;
            overflow: hidden; white-space: nowrap;
        }
        .tc-meta-model {
            overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
        }
        .tc-meta-dot { flex-shrink: 0; opacity: .5; }
        .tc-card-foot { display: flex; align-items: center; gap: 3px; }
        .tc-stars { display: flex; gap: 1px; }
        .tc-star {
            width: 15px; height: 15px; padding: 0; border: none; background: none;
            cursor: pointer; color: var(--tc-border-strong); line-height: 0;
        }
        .tc-star svg { width: 13px; height: 13px; }
        .tc-star.on { color: var(--tc-star); }
        .tc-star.on svg { fill: var(--tc-star); }
        .tc-card-actions { margin-left: auto; display: flex; gap: 2px; }
        .tc-icon-btn {
            width: 24px; height: 24px; border-radius: 6px; border: none;
            background: none; color: var(--tc-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .tc-icon-btn:hover { background: var(--tc-subtle); color: var(--tc-text); }
        .tc-icon-btn.danger:hover { background: rgba(229,72,77,.1); color: var(--tc-danger); }
        .tc-icon-btn svg { width: 13px; height: 13px; }

        .tc-more { display: flex; justify-content: center; padding: 22px 0 0; }

        /* ---------- lightbox ---------- */
        .tc-lightbox {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,.86); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 14px; padding: 32px;
        }
        .tc-lightbox.show { display: flex; }
        .tc-lightbox img {
            max-width: 90vw; max-height: 78vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .tc-lightbox-prompt {
            max-width: 780px; text-align: center; color: rgba(255,255,255,.78);
            font-size: 13px; line-height: 1.6;
        }
        .tc-lightbox-close {
            position: absolute; right: 22px; top: 18px;
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: rgba(255,255,255,.12); color: #fff; cursor: pointer;
            font-size: 20px; line-height: 1;
        }
        .tc-lightbox-close:hover { background: rgba(255,255,255,.22); }

        .tc-toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 14px);
            padding: 9px 16px; border-radius: 9px; font-size: 12.5px;
            background: var(--tc-accent); color: var(--tc-accent-text);
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
            z-index: 1000;
        }
        .tc-toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body>
<div class="tc-shell">
    <div class="tc-header">
        <div>
            <div class="tc-title">任务中心</div>
            <div class="tc-sub">跨页面统一产出、收藏与用量统计</div>
        </div>
        <div class="tc-header-right">
            <span class="tc-live" id="liveBadge" title="本地 ComfyUI 队列">
                <span class="tc-live-dot idle" id="liveDot"></span>
                <span id="liveText">空闲</span>
            </span>
            <button class="tc-btn" id="refreshBtn" type="button" title="刷新数据">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
                <span>刷新</span>
            </button>
        </div>
    </div>

    <div class="tc-tabs">
        <button class="tc-tab active" data-tab="overview" type="button">概览</button>
        <button class="tc-tab" data-tab="tasks" type="button">任务<span class="tc-tab-count" id="taskCount">0</span></button>
    </div>

    <!-- 概览 -->
    <div class="tc-pane active" id="pane-overview">
        <div class="tc-stats" id="statCards"></div>

        <div class="tc-panel">
            <div class="tc-panel-head">
                <div class="tc-panel-title">生成趋势</div>
                <div class="tc-panel-hint" id="trendHint">近 14 天</div>
            </div>
            <div class="tc-chart" id="trendChart"></div>
        </div>

        <div class="tc-panel">
            <div class="tc-panel-head">
                <div class="tc-panel-title">正在运行</div>
                <div class="tc-panel-hint">本地 ComfyUI 队列</div>
            </div>
            <div class="tc-run-list" id="runList"></div>
        </div>

        <div class="tc-two-col">
            <div class="tc-panel">
                <div class="tc-panel-head"><div class="tc-panel-title">按类型</div></div>
                <div class="tc-dist" id="distType"></div>
            </div>
            <div class="tc-panel">
                <div class="tc-panel-head"><div class="tc-panel-title">按供应商</div></div>
                <div class="tc-dist" id="distProvider"></div>
            </div>
        </div>

        <div class="tc-panel">
            <div class="tc-panel-head"><div class="tc-panel-title">常用模型 Top 8</div></div>
            <div class="tc-dist" id="distModel"></div>
        </div>
    </div>

    <!-- 任务 -->
    <div class="tc-pane" id="pane-tasks">
        <div class="tc-toolbar">
            <div class="tc-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
                <input id="searchInput" type="text" placeholder="搜索提示词 / 模型 / 供应商" autocomplete="off">
            </div>
            <select class="tc-select" id="typeSelect"><option value="">全部类型</option></select>
            <select class="tc-select" id="providerSelect"><option value="">全部供应商</option></select>
            <select class="tc-select" id="daysSelect">
                <option value="0">全部时间</option>
                <option value="1">今天</option>
                <option value="7">近 7 天</option>
                <option value="30">近 30 天</option>
            </select>
            <select class="tc-select" id="sortSelect">
                <option value="new">最新优先</option>
                <option value="old">最旧优先</option>
                <option value="rating">评分优先</option>
            </select>
            <button class="tc-chip-toggle" id="favFilter" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
                <span>仅看收藏</span>
            </button>
        </div>

        <div class="tc-selbar" id="selBar">
            <span class="tc-selbar-count" id="selCount">已选 0 项</span>
            <span class="tc-selbar-spacer"></span>
            <button class="tc-btn" id="selFavBtn" type="button">批量收藏</button>
            <button class="tc-btn danger" id="selDelBtn" type="button">批量移除</button>
            <button class="tc-btn" id="selClearBtn" type="button">取消选择</button>
        </div>

        <div class="tc-grid" id="taskGrid"></div>
        <div class="tc-empty" id="taskEmpty" style="display:none">还没有匹配的生成记录</div>
        <div class="tc-more" id="loadMoreWrap" style="display:none">
            <button class="tc-btn" id="loadMoreBtn" type="button">加载更多</button>
        </div>
    </div>
</div>

<div class="tc-lightbox" id="lightbox">
    <button class="tc-lightbox-close" id="lightboxClose" type="button">&times;</button>
    <img id="lightboxImg" alt="">
    <div class="tc-lightbox-prompt" id="lightboxPrompt"></div>
</div>
<div class="tc-toast" id="toast"></div>

<script src="/static/js/task-center.js?v=2026.08.04.1793765017"></script>
</body>
</html>
